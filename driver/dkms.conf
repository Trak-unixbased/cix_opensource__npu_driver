# DKMS configuration — ArmChina Zhouyi V3 NPU (aipu.ko)
# Cible : Orange Pi 6 Plus, SoC CIX CD8180 (SKY1), Ubuntu 26.04 LTS aarch64

PACKAGE_NAME="aipu"
PACKAGE_VERSION="6.0.1"

# --- Options de build (réellement transmises à make via MAKE[0]) -------------
AIPU_KMD_VERSION="BUILD_ZHOUYI_V3"
AIPU_TARGET_PLATFORM="BUILD_PLATFORM_SKY1"
# Version renvoyée à l'UMD par l'ioctl GET_DRIVER_VERSION.
# Alignée sur le défaut du Makefile / npu.mk (5.11.0), indépendante de PACKAGE_VERSION.
AIPU_KMD_VERSION_STRING="5.11.0"
# DVFS : exige scmi_device_*() du noyau vendeur CIX, absent du noyau Ubuntu.
# Passer à "y" uniquement sur noyau CIX (vérifier : grep scmi_device_set_freq Module.symvers).
AIPU_NPU_DEVFREQ="n"
# Passer à "y" si insmod provoque un oops dans reserve_iova().
AIPU_SKIP_IOVA_RESERVE="n"

# --- Module -----------------------------------------------------------------
BUILT_MODULE_NAME[0]="aipu"
DEST_MODULE_LOCATION[0]="/updates/dkms"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build \
 BUILD_AIPU_VERSION_KMD=${AIPU_KMD_VERSION} \
 BUILD_TARGET_PLATFORM_KMD=${AIPU_TARGET_PLATFORM} \
 COMPASS_DRV_BTENVAR_KMD_VERSION=${AIPU_KMD_VERSION_STRING} \
 BUILD_NPU_DEVFREQ=${AIPU_NPU_DEVFREQ} \
 AIPU_SKIP_IOVA_RESERVE=${AIPU_SKIP_IOVA_RESERVE} \
 modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

# --- Restrictions (directives natives DKMS, contrôlées contre ${kernel_source_dir}/.config)
BUILD_EXCLUSIVE_ARCH="aarch64"
BUILD_EXCLUSIVE_CONFIG="CONFIG_ARCH_CIX CONFIG_IOMMU_DMA CONFIG_DMA_SHARED_BUFFER"

# Reconstruction automatique à chaque mise à jour du noyau
AUTOINSTALL="yes"
